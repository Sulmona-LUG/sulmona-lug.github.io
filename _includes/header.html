<header class="site-header">
  <div class="wrap">
    <a class="site-logo" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/images/ovidiux.png' | relative_url }}" alt="{{ site.title }}" width="40" height="40">
      <span>{{ site.title }}</span>
    </a>

    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-toggle-label" aria-label="Apri il menu">
      <span></span><span></span><span></span>
    </label>

    <nav class="site-nav">
      <ul>
        {% for item in site.nav %}
        <li>
          <a href="{{ item.url | relative_url }}"
             {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.title }}</a>
        </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
